# The5ers MT5 模擬成本設定檔（可隨時依實際帳戶點差與手續費微調）
# 手續費：約名目的 0.001%（萬分之 0.1 = 0.00001）每邊
# 實例：0.2 手 XAUUSD ≈ 20 oz × $4,000 = $80,000 名目 → 0.001% = $0.80 USD 每邊

defaults:
  fee_rate_per_side: 0.00001   # 名目 0.001% 每邊（0.1 bps）
  slippage_bps_per_side: 0.0   # 已由實盤點差涵蓋，如需額外滑價可調高
  stress_spread_multiplier: 1.5

instruments:
  DAX40:
    market: index
    session: london
    dukascopy_pair: DEUIDXEUR
    dukascopy_divisor: 1000.0
    spread_points: 1.5         # 約 1.5 點
    max_leverage: 20.0
  JPN225:
    market: index
    session: tokyo
    dukascopy_pair: JPNIDXJPY
    dukascopy_divisor: 1000.0
    spread_points: 8.0         # 約 8 點
    max_leverage: 20.0
  NAS100:
    market: index
    session: ny
    dukascopy_pair: USATECHIDXUSD
    dukascopy_divisor: 1000.0
    spread_points: 1.5         # 約 1.5 點
    max_leverage: 20.0
  SP500:
    market: index
    session: ny
    dukascopy_pair: USA500IDXUSD
    dukascopy_divisor: 1000.0
    spread_points: 0.8         # 約 0.8 點
    max_leverage: 20.0
  UK100:
