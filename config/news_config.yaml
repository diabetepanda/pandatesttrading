# 消息面產生器設定檔（完全免 API Key）
version: 1

http:
  request_timeout_sec: 8   # 單次請求上限 <= 10 秒，確保 Actions 3 分鐘內完成
  max_retries: 1           # 失敗最多重試 1 次
  user_agent: "Mozilla/5.0 (compatible; SignalDeskNewsBot/1.0; +https://github.com/diabetepanda/pandatesttrading)"

schedule:
  taipei_hours: [8, 20]    # 每天台北 08:00 (UTC 00:00) 與 20:00 (UTC 12:00)
  recent_days_window: 7    # news_latest.json 保留最近 7 天索引
  signal_news_days: 3      # 訊號卡片顯示最近 3 天相關消息
  max_items_per_feed: 25   # 單一新聞來源最多取前 N 則
  max_item_age_hours: 72   # 僅收錄發布時間在 72 小時內的新聞

dedup:
  title_similarity_threshold: 0.78   # 同標題高度相似視為同一則新聞，只收一次
  followup_similarity_min: 0.46      # 後續期別出現同事件延伸報導（相似度介於 0.46~0.78）標記「同事件後續」
  followup_lookback_days: 7          # 往回比對 7 天內歷史事件

# 數據類消息觸發門檻（僅在變化明顯時產生，避免日常雜訊）
data_thresholds:
  funding_rate_high_pct:
    value: 0.05
    unit: "% / 8h"
    rationale: "永續合約正常多頭基準資金費率約 +0.01%/8h；達 +0.05%（年化約 55%）代表多頭槓桿過度擁擠，具長倉擠壓回調風險。"
  funding_rate_low_pct:
    value: -0.03
    unit: "% / 8h"
    rationale: "因永續合約基準費率為正值，跌破 -0.03%/8h（年化約 -33%）已顯著偏離基準，代表空頭情緒極端或出現軋空條件。"
  open_interest_24h_change_pct:
    value: 10.0
    unit: "%"
    rationale: "主要幣種 24 小時未平倉量（OI）變動超過 ±10% 代表槓桿資金快速集中進場或出現大規模強制平倉去槓桿。"
  stablecoin_1d_change_pct:
    value: 0.5
    unit: "%"
    rationale: "全球穩定幣總市值約 2,800 億美元，單日變動達 ±0.5% 約當十多億美元淨鑄造或贖回，反映鏈上買盤流動性顯著變化。"
  stablecoin_1d_change_usd_m:
    value: 500.0
    unit: "百萬美元"
    rationale: "單日穩定幣總供給絕對變動達 5 億美元以上，代表大額法幣進出場或機構資金調度。"
  chain_tvl_1d_change_pct:
    value: 5.0
    unit: "%"
    min_tvl_usd_m: 1000.0
    rationale: "僅追蹤 TVL >= 10 億美元之主要公鏈，單日變動超過 ±5% 通常對應重大資金跨鏈遷移、幣價劇烈波動或協議事件。"
  hack_min_amount_usd:
    value: 1000000
    unit: "美元"
    lookback_hours: 72
    rationale: "過濾長尾小額漏洞，僅收錄單筆損失達 100 萬美元以上且發生於 72 小時內之安全事件，因具市場外溢風險。"
  btc_etf_net_flow_abs_usd_m:
    value: 150.0
    unit: "百萬美元"
    rationale: "美國比特幣現貨 ETF 單日合計淨流入或淨流出超過 1.5 億美元，代表機構現貨籌碼出現明顯方向性買盤或賣壓。"
  mempool_fastest_fee_sat_vb:
    value: 50
    unit: "sat/vB"
    rationale: "比特幣網路最速確認手續費達 50 sat/vB 以上代表鏈上區塊空間出現明顯搶單擁擠。"
  mempool_vsize_mb:
    value: 80.0
    unit: "vMB"
    rationale: "Mempool 待確認交易體積超過 80 vMB（約 80 個滿載區塊以上）代表鏈上擁擠度顯著升高，可能延遲交易所充提。"

