# 事後市場反應判讀門檻（60 分鐘報酬率）
reaction_thresholds:
  crypto:
    threshold_60m_pct: 0.5
    unit: "%"
    rationale: "加密貨幣 24 小時交易且波動度較高，事件後 60 分鐘漲跌幅超過 ±0.5% 才視為具統計意義的方向反應。"
  us_index:
    threshold_60m_pct: 0.3
    unit: "%"
    rationale: "美股主要指數（NAS100、SP500）流動性深、日內波動較溫和，60 分鐘超過 ±0.3% 即屬明確方向反應。"
  tw_index:
    threshold_60m_pct: 0.3
    unit: "%"
    rationale: "台股加權指數（TWII）受權值股與外資籌碼影響，60 分鐘漲跌幅達 ±0.3% 以上即顯示明確多空解讀。"
  stock:
    threshold_60m_pct: 1.0
    unit: "%"
    rationale: "美股與台股個股受單一消息影響振幅較大，以 60 分鐘 ±1.0% 作為顯著市場反應門檻。"
  commodity:
    threshold_60m_pct: 0.4
    unit: "%"
    rationale: "黃金、原油等大宗商品受宏觀與避險資金驅動，60 分鐘 ±0.4% 足以區分實質定價與日常波動。"
