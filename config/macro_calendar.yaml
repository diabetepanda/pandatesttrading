# ==============================================================================
# 美國總體經濟指標公布時程、歷史公布日期與已查證市場共識預期
# ==============================================================================
#
# 【資料來源說明】
# 1. 聯準會 FOMC 會議時程與決議：
#    - 官方來源：https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#    - 公布時間：會議第二天美東時間 14:00（主席記者會 14:30）
#    - 台北時間換算：美國夏令時（EDT）為次日 02:00；冬令時（EST）為次日 03:00
# 2. CPI、非農就業（NFP／失業率／平均時薪）、PPI：
#    - 官方來源：美國勞工統計局 BLS https://www.bls.gov/schedule/news_release/
#      - CPI: cpi.htm / 非農: empsit.htm / PPI: ppi.htm
#    - 公布時間：美東時間 08:30（夏令時 20:30 / 冬令時 21:30 台北時間）
#    - 註：2025 年 10–11 月因美國聯邦政府撥款中斷（停擺），2025 年 10 月 CPI 未公布、
#      2025 年 10 月非農併入 11 月報告、部分 BLS 公布日順延，皆依 BLS 官方存檔紀錄。
# 3. PCE、核心 PCE、GDP：
#    - 官方來源：美國經濟分析局 BEA https://www.bea.gov/news/schedule
#    - 公布時間：美東時間 08:30（少數停擺補發報告為美東 10:00，見個別條目）
# 4. 零售銷售（Advance Monthly Retail Sales）：
#    - 官方來源：美國普查局 Census Bureau https://www.census.gov/economic-indicators/
#    - 公布時間：美東時間 08:30
# 5. 初請失業金人數（Initial Jobless Claims）：
#    - 官方來源：美國勞工部 DOL（每週四美東 08:30 公布前一週截至週六數據；遇感恩節等週四國定假日提前至週三）
# 6. ISM 製造業 PMI / ISM 服務業 PMI：
#    - 官方來源：Institute for Supply Management (ISM) / PR Newswire 報告
#      - 製造業：每月第 1 個美國工作日美東 10:00（夏令時 22:00 / 冬令時 23:00 台北時間）
#      - 服務業：每月第 3 個美國工作日美東 10:00
#    - FRED 未收錄 ISM 序列，故歷史值與最新讀數結合本檔存檔與 TradingEconomics 公開頁面自動更新。
# 7. 預期值（Consensus）原則：
#    - 僅記錄有可靠公開出處（TradingEconomics、Investing.com、ForexFactory、WSJ、路透／道瓊調查、CME FedWatch）
#      之共識預期，並註明出處；無可靠出處者留空（null），前端顯示「無可靠預期值」並改用前值比較，絕不估算或編造。
#
# 【如何每年更新】
# 1. 每年 Q4（約 10–12 月），BLS、BEA、Census 與聯準會會公布下一年度完整時程表。
# 2. 至上述官方頁面確認新年度日期後，依相同格式新增至各指標的 `upcoming_releases` 與 `fomc.upcoming`。
# 3. `src/macro.py` 會自動把過期的 `upcoming_releases`（當 FRED 已出現對應期間實際值）轉入已公布紀錄，
#    不需手動搬移；若遇政府停擺或假日調期，再依官方公告修正該期 `release_et` 即可。
# ==============================================================================

version: 1

timezone_notes:
  dst_rule: "美國夏令時（EDT，3月第2個週日～11月第1個週日）比台北慢12小時；冬令時（EST，11月第1個週日～次年3月第2個週日）比台北慢13小時。"
  examples:
    - "美東 08:30（CPI / PCE / PPI / 非農 / GDP / 零售 / 初請）＝ 夏令時台北 20:30｜冬令時台北 21:30"
    - "美東 10:00（ISM 製造業 / 服務業 PMI）＝ 夏令時台北 22:00｜冬令時台北 23:00"
    - "美東 14:00（FOMC 利率決議）＝ 夏令時台北次日 02:00｜冬令時台北次日 03:00"

