project:
  name: Signal Desk
  github_owner: diabetepanda
  github_repo: pandatesttrading
  data_branch: data
  timezone_internal: UTC
  timezone_display: Asia/Taipei

schedule:
  scan_interval_minutes: 15
  max_candle_delay_minutes: 20
  max_4h_candle_delay_minutes: 260
  max_daily_candle_delay_minutes: 1500
  scan_cache_dir: .cache/scan_bars
  ui_stale_warning_minutes: 45
  keep_run_logs: 100

account:
  initial_capital_usd: 100000.0
  pools:
    short_term:
      capital_usd: 30000.0
    long_term:
      capital_usd: 70000.0

risk:
  maintenance_margin_ratio: 0.50
  default_slippage_bps: 1.0

analytics:
  min_verified_trades_stats: 50
  min_cagr_days: 30
  risk_free_rate_annual: 0.0

signals:
  timezone_display: Asia/Taipei

backtest:
  min_history_years: 5.0
  in_sample_ratio: 0.7
  out_sample_ratio: 0.3
  min_oos_trades: 30
  max_oos_drawdown_pct: 25.0
  min_oos_profit_factor: 1.3
  atr_period: 14
  risk_per_trade_pct: 1.0
  max_total_open_risk_pct: 10.0
  max_concurrent_positions: 10
  max_position_notional_pct: 500.0
  max_total_notional_multiple: 5.0
  archive_cache_dir: .cache/binance_monthly
  dukascopy_cache_dir: .cache/dukascopy
  gold_backup_symbol: PAXGUSDT

strategies:
  S1:
    name: 開盤區間突破
    pool: short_term
    capital_usd: 10000.0
    interval: 15m
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
      - XRPUSDT
      - DOGEUSDT
      - ADAUSDT
      - AVAXUSDT
      - LINKUSDT
      - LTCUSDT
      - XAUUSD
      - WTI
    allow_short: true
    candidates:
      session_opens_utc: ["00:00", "13:30"]
      range_minutes: 60
      sl_modes: ["range_edge", "atr_1.5", "atr_2.0"]
      eod_close_utc: "23:45"
  S2:
    name: 4 小時突破
    pool: short_term
    capital_usd: 10000.0
    interval: 4h
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      breakout_bars: [12, 20, 30]
      trail_bars: [6, 10]
      sl_atr_mults: [2.0, 2.5]
      max_hold_bars: 30
  S3:
    name: 日線 RSI 回檔
    pool: short_term
    capital_usd: 10000.0
    interval: 1d
    markets: ["crypto", "forex", "commodity", "index"]
    allow_short: true
    candidates:
      trend_ma_period: 200
      rsi_periods: [2, 3]
      rsi_long_thresholds: [10.0, 15.0]
      exit_ma_periods: [5, 8]
      allow_short_modes: [false, true]
      sl_atr_mult: 2.5
      max_hold_bars: 10
  L1:
    name: 波動度調整趨勢跟隨
    pool: long_term
    capital_usd: 23333.33
    interval: 1d
    markets: ["crypto", "forex", "commodity", "index"]
    allow_short: true
    candidates:
      entry_periods: [20, 55]
      exit_periods: [10, 20]
      sl_atr_mults: [2.5, 3.0]
      vol_target_pcts: [0.012, 0.018]
  L2:
    name: 精簡標的趨勢跟隨
    pool: long_term
    capital_usd: 23333.33
    interval: 1d
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
      - XRPUSDT
      - DOGEUSDT
      - ADAUSDT
      - AVAXUSDT
      - LINKUSDT
      - LTCUSDT
      - XAUUSD
      - WTI
      - EURUSD
      - GBPUSD
      - USDJPY
      - AUDUSD
      - USDCAD
      - USDCHF
      - NAS100
      - SP500
      - JP225
      - TWII
    allow_short: true
    candidates:
      entry_periods: [20, 55]
      exit_periods: [10, 20]
      sl_atr_mults: [2.5, 3.0]
      vol_target_pcts: [0.015]
  L3:
    name: 雙動能
    pool: long_term
    capital_usd: 23333.34
    interval: 1d
    markets: ["crypto", "index"]
    allow_short: false
    candidates:
      lookback_days: [20, 60, 120]
      top_k_crypto_list: [2, 3]
      top_k_index_list: [1, 2]
      rebalance_days: 7
      sl_atr_mults: [2.5, 3.0]

data_quality:
  max_missing_ratio: 0.10
  max_delay_minutes:
    "1m": 15
    "15m": 45
    "1d": 2880
  abnormal_gap_atr_mult: 5.0
  request_timeout_sec: 15

correlation_groups:
  crypto_majors:
    name: 加密主流幣
  crypto_layer1:
    name: 加密 Layer1 公鏈
  crypto_layer2:
    name: 加密 Layer2 擴容
  crypto_defi:
    name: 加密 DeFi 與基建
  crypto_meme_ai:
    name: 加密迷因與 AI
  usd_fx:
    name: 美元相關外匯
  gbp_fx:
    name: 英鎊相關外匯
  jpy_cross:
    name: 日圓交叉
  precious_metals:
    name: 貴金屬
  energy:
    name: 能源
  industrial_metals:
    name: 工業金屬
  index_equities:
    name: 全球主要指數
  us_equities:
    name: 美股大型股

