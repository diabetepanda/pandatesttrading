project:
  name: Signal Desk
  github_owner: diabetepanda
  github_repo: pandatesttrading
  data_branch: data
  timezone_internal: UTC
  timezone_display: Asia/Taipei

schedule:
  scan_interval_minutes: 15
  max_candle_delay_minutes: 20
  ui_stale_warning_minutes: 45
  keep_run_logs: 100

account:
  initial_capital_usd: 100000.0
  pools:
    short_term:
      capital_usd: 20000.0
      target_notional_usd: 2000.0
      max_concurrent_trades: 10
    long_term:
      capital_usd: 80000.0
      target_notional_usd: 8000.0
      max_concurrent_trades: 10

risk:
  max_risk_per_trade_usd:
    short_term: 250.0
    long_term: 500.0
  max_total_stop_risk_usd: 3000.0
  max_daily_loss_usd: 1500.0
  max_weekly_loss_usd: 4000.0
  drawdown_warning_pct: 8.0
  drawdown_warning_risk_multiplier: 0.5
  drawdown_pause_pct: 12.0
  max_margin_usage_pct: 30.0
  max_group_stop_risk_usd: 1000.0
  stop_to_liquidation_max_ratio: 0.5
  maintenance_margin_ratio: 0.50
  default_slippage_bps: 1.0

scaling:
  default_policy: E
  policies: ["A", "B", "C", "D", "E"]
  max_stages: 3
  weights:
    A: [0.50, 0.30, 0.20]
    B: [0.33, 0.33, 0.34]
    C: [0.30, 0.30, 0.40]
    D: [0.20, 0.30, 0.50]
    E: [0.40, 0.35, 0.25]
  policy_e_atr_high_threshold: 1.2
  policy_e_atr_low_threshold: 0.8
  policy_e_high_vol_multiplier: 0.75
  policy_e_low_vol_multiplier: 1.15
  trend_add_min_profit_r: 1.0

signals:
  max_daily_signals: 10
  order_expiry_hours: 4
  tp1_close_fraction: 0.50
  breakeven_trigger_r: 1.0
  trailing_stop_trigger_r: 2.0
  trailing_stop_atr_mult: 2.0

strategy_a:
  enabled_markets: ["crypto", "forex", "commodity"]
  lookback_days_liquidity: 45
  low_liquidity_percentile: 33.33
  settlement_avoid_minutes: 30
  adx_period: 14
  adx_max: 20.0
  bb_percentile_max: 30.0
  atr_period: 14
  atr_ratio_max: 1.2
  event_before_hours: 4
  event_after_minutes: 60
  range_bars_15m: 48
  min_edge_touches: 2
  range_height_atr_min: 1.0
  range_height_atr_max: 2.5
  entry_edge_pct: 15.0
  rsi_period: 14
  rsi_overbought: 65.0
  rsi_oversold: 35.0
  sl_atr_buffer: 0.5
  tp1_rr_min: 1.5
  tp2_rr_min: 2.0
  max_hold_bars_15m: 24
  pre_session_end_close_minutes: 30
  breakout_bar_atr_mult: 2.5
  breakout_atr_ratio_trigger: 1.8
  bb_period: 20
  bb_std: 2.0
  atr_baseline_days: 20
  edge_touch_tolerance_pct: 15.0
  add_atr_mult: 0.35
  max_abs_funding_rate: 0.001
  max_oi_surge_pct: 10.0

strategy_b:
  min_history_years: 5
  in_sample_ratio: 0.7
  out_sample_ratio: 0.3
  min_oos_trades: 30
  max_oos_drawdown_pct: 25.0
  min_oos_profit_factor: 1.3
  sl_atr_min_mult: 2.0
  sl_atr_max_mult: 3.0
  min_rr: 2.0
  atr_period: 14
  walk_forward_windows: 3
  default_notional_usd: 8000.0
  candidates:
    donchian_periods: [20, 55, 100]
    ema_fast_slow: [[20, 100], [50, 200]]
    weekly_ema_periods: [10, 20]
    sl_atr_mults: [2.0, 2.5, 3.0]

data_quality:
  max_missing_ratio: 0.10
  max_delay_minutes:
    "1m": 15
    "15m": 45
    "1d": 2880
  abnormal_gap_atr_mult: 5.0
  request_timeout_sec: 15

correlation_groups:
  crypto_majors:
    name: 加密主流幣
    max_stop_risk_usd: 1000.0
  usd_fx:
    name: 美元相關外匯
    max_stop_risk_usd: 1000.0
  jpy_cross:
    name: 日圓交叉
    max_stop_risk_usd: 1000.0
  precious_metals:
    name: 貴金屬
    max_stop_risk_usd: 1000.0
  energy:
    name: 能源
    max_stop_risk_usd: 1000.0
  industrial_metals:
    name: 工業金屬
    max_stop_risk_usd: 1000.0
  us_equities:
    name: 美股大型股
    max_stop_risk_usd: 1000.0

instruments:
  # --- 加密貨幣 (24/7) ---
  - symbol: BTCUSDT
    display_name: Bitcoin (BTC/USDT)
    market: crypto
    correlation_group: crypto_majors
    enabled: true
    assumed_spread_bps: 2.0
    fee_rate: 0.0005
    tick_size: 0.1
    trading_hours: "24/7"
    max_leverage: 10.0
    overnight_cost_daily_bps: 3.0
    sources:
      binance_vision: BTCUSDT
      okx: BTC-USDT
      kraken: XBTUSDT
      coinbase: BTC-USD
      bybit: BTCUSDT

  - symbol: ETHUSDT
    display_name: Ethereum (ETH/USDT)
    market: crypto
    correlation_group: crypto_majors
    enabled: true
    assumed_spread_bps: 3.0
    fee_rate: 0.0005
    tick_size: 0.01
    trading_hours: "24/7"
    max_leverage: 10.0
    overnight_cost_daily_bps: 3.0
    sources:
      binance_vision: ETHUSDT
      okx: ETH-USDT
      kraken: ETHUSDT
      coinbase: ETH-USD
      bybit: ETHUSDT

  - symbol: SOLUSDT
    display_name: Solana (SOL/USDT)
    market: crypto
    correlation_group: crypto_majors
    enabled: true
    assumed_spread_bps: 5.0
    fee_rate: 0.0005
    tick_size: 0.01
    trading_hours: "24/7"
    max_leverage: 5.0
    overnight_cost_daily_bps: 3.0
