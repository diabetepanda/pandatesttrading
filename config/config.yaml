    max_stop_risk_usd: 1000.0
  usd_fx:
    name: 美元相關外匯
    max_stop_risk_usd: 1000.0
  gbp_fx:
    name: 英鎊相關外匯
    max_stop_risk_usd: 1000.0
  jpy_cross:
    name: 日圓交叉
    max_stop_risk_usd: 1000.0
  precious_metals:
    name: 貴金屬
    max_stop_risk_usd: 1000.0
  energy:
    name: 能源
    max_stop_risk_usd: 1000.0
  industrial_metals:
    name: 工業金屬
    max_stop_risk_usd: 1000.0
  us_equities:
