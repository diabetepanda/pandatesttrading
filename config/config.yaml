project:
  name: Signal Desk
  github_owner: diabetepanda
  github_repo: pandatesttrading
  data_branch: data
  timezone_internal: UTC
  timezone_display: Asia/Taipei

schedule:
  scan_interval_minutes: 15
  max_candle_delay_minutes: 20
  ui_stale_warning_minutes: 45
  keep_run_logs: 100

account:
  initial_capital_usd: 100000.0
  pools:
    short_term:
      capital_usd: 30000.0
      target_notional_usd: 1500.0
      max_concurrent_trades: 10
    long_term:
      capital_usd: 70000.0
      target_notional_usd: 4000.0
      max_concurrent_trades: 15

risk:
  max_risk_per_trade_usd:
    short_term: 250.0
    long_term: 500.0
  max_total_stop_risk_usd: 3000.0
  max_daily_loss_usd: 1500.0
  max_weekly_loss_usd: 4000.0
  drawdown_warning_pct: 8.0
  drawdown_warning_risk_multiplier: 0.5
  drawdown_pause_pct: 12.0
  max_margin_usage_pct: 30.0
  max_group_stop_risk_usd: 1000.0
  stop_to_liquidation_max_ratio: 0.5
  maintenance_margin_ratio: 0.50
  default_slippage_bps: 1.0
  short_term_tp1_rr_min: 1.5
  short_term_tp2_rr_min: 2.0
  long_term_min_rr: 2.0

scaling:
  default_policy: E
  policies: ["A", "B", "C", "D", "E"]
  max_stages: 3
  weights:
    A: [0.50, 0.30, 0.20]
    B: [0.33, 0.33, 0.34]
    C: [0.30, 0.30, 0.40]
    D: [0.20, 0.30, 0.50]
    E: [0.40, 0.35, 0.25]
  policy_e_atr_high_threshold: 1.2
  policy_e_atr_low_threshold: 0.8
  policy_e_high_vol_multiplier: 0.75
  policy_e_low_vol_multiplier: 1.15
  trend_add_min_profit_r: 1.0

analytics:
  min_verified_trades_shadow: 30
  min_verified_trades_stats: 50
  min_cagr_days: 30
  risk_free_rate_annual: 0.0

signals:
  max_daily_signals: 10
  order_expiry_hours: 4
  tp1_close_fraction: 0.50
  breakeven_trigger_r: 1.0
  trailing_stop_trigger_r: 2.0
  trailing_stop_atr_mult: 2.0
  max_hold_bars_15m: 24
  breakout_bar_atr_mult: 2.5
  breakout_atr_ratio_trigger: 1.8

backtest:
  min_history_years: 5.0
  in_sample_ratio: 0.7
  out_sample_ratio: 0.3
  min_oos_trades: 30
  max_oos_drawdown_pct: 25.0
  min_oos_profit_factor: 1.3
  atr_period: 14

strategies:
  S1:
    name: RSI(2) 回檔買進
    pool: short_term
    capital_usd: 10000.0
    interval: 1h
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      trend_ma_periods: [200]
      exit_ma_periods: [5]
      rsi_period: 2
      rsi_long_thresholds: [10.0, 15.0]
      rsi_short_thresholds: [90.0, 85.0]
      sl_atr_mults: [2.0, 2.5]
  S2:
    name: 波動突破
    pool: short_term
    capital_usd: 10000.0
    interval: 15m
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      bb_period: 20
      bb_std: 2.0
      squeeze_lookbacks: [48, 96]
      squeeze_percentiles: [20.0, 30.0]
      sl_atr_mults: [1.2, 1.5]
  S3:
    name: 區間來回
    pool: short_term
    capital_usd: 10000.0
    interval: 15m
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      range_bars: [32, 48]
      min_edge_touches: 2
      edge_zone_pcts: [15.0, 20.0]
      rsi_period: 14
      rsi_oversold_levels: [30.0, 35.0]
      rsi_overbought_levels: [70.0, 65.0]
      sl_atr_buffers: [0.5]
  L1:
    name: 多標的趨勢跟隨
    pool: long_term
    capital_usd: 23333.33
    interval: 1d
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      entry_periods: [20, 55]
      exit_periods: [10, 20]
      sl_atr_mults: [2.0, 2.5, 3.0]
  L2:
    name: 加密強弱輪動
    pool: long_term
    capital_usd: 23333.33
    interval: 1d
    markets: ["crypto"]
    allow_short: false
    candidates:
      lookback_days: [14, 28, 56]
      top_k_list: [3, 5]
      rebalance_days: 7
      sl_atr_mults: [2.5, 3.0]
  L3:
    name: 200 日均線趨勢過濾
    pool: long_term
    capital_usd: 23333.34
    interval: 1d
    markets: ["crypto", "forex", "commodity"]
    allow_short: true
    candidates:
      ma_periods: [150, 200]
      sl_atr_mults: [2.5, 3.0]

data_quality:
  max_missing_ratio: 0.10
  max_delay_minutes:
    "1m": 15
    "15m": 45
    "1d": 2880
  abnormal_gap_atr_mult: 5.0
  request_timeout_sec: 15

correlation_groups:
  crypto_majors:
    name: 加密主流幣
    max_stop_risk_usd: 1000.0
  crypto_layer1:
    name: 加密 Layer1 公鏈
