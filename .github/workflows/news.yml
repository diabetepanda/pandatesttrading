name: News Digest (15m)

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Prepare data branch workspace
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads https://github.com/${{ github.repository }}.git data >/dev/null 2>&1; then
            git clone --branch data --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data_repo
          else
            git clone --no-checkout https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data_repo
            cd data_repo
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: main_repo/requirements.txt

      - name: Install dependencies
        run: pip install -r main_repo/requirements.txt

      - name: Generate news archive and indices
        working-directory: main_repo
        run: python -m src.news --out-dir ../data_repo

      - name: Commit and push news files to data branch
        working-directory: data_repo
        run: |
          git add news news_latest.json news_index.json news_state.json news_reactions.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore(data): news update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            python3 ../main_repo/src/jobs/data_sync.py --repo-dir . --branch data --max-retries 3
          else
            git push origin data
          fi
